name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  torznab-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Torznab parser tests
        working-directory: bot
        run: python -m unittest discover -s tests -v
